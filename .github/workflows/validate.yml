name: Validate model catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 validate.py
      - run: python3 validate_offline.py
      - run: python3 -m unittest discover -s tests -v
